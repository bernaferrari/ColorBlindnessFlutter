name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest 
    
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
      - run: flutter config --enable-web
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: |
          cd example/
          flutter pub get
          flutter test
          flutter build web --release --no-web-resources-cdn --web-content-hash --base-href /ColorBlindnessFlutter/
          git clone --single-branch "https://${{ secrets.PAT }}@github.com/bernaferrari/bernaferrari.github.io.git" "clone_dir"
          rm -rf clone_dir/ColorBlindnessFlutter
          cp -r build/web clone_dir/ColorBlindnessFlutter
          cd clone_dir
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A -- ColorBlindnessFlutter
          git commit -m "generate ColorBlindnessFlutter"
          git push
